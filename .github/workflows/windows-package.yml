name: Solar Windows x64
on:
  push:
    branches: [main, codex/solar-0140-windows]
    paths: ['.github/workflows/windows-package.yml', 'scripts/windows-smoke.ps1', 'src/**', 'src-tauri/**', 'public/**', 'package*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solar-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      # Portable x64 CPU backend; never optimize the public binary for the runner CPU.
      GGML_NATIVE: 'OFF'
      GGML_SSE42: 'OFF'
      GGML_AVX: 'OFF'
      GGML_AVX2: 'OFF'
      GGML_FMA: 'OFF'
      GGML_F16C: 'OFF'
      GGML_BMI2: 'OFF'
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: ${{ github.sha }}
      - name: Pin reproducible npm
        run: npm install --global npm@10.9.4 --ignore-scripts
      - run: npm ci
      - name: Frontend contracts
        run: |
          npm run build
          node scripts/messenger-contract.test.mjs
          npm run test:chat
      - name: Diagnose Windows Node child environment
        run: |
          rustc scripts/windows-node-probe.rs -o solar-node-probe.exe
          ./solar-node-probe.exe
      - name: Native Windows tests
        run: cargo test --release --target x86_64-pc-windows-msvc --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Windows Credential Manager round-trip
        run: cargo test --release --target x86_64-pc-windows-msvc --locked --manifest-path src-tauri/Cargo.toml disposable_roundtrip -- --ignored
      - name: Build NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Install and launch actual Windows application
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Solar-0.14.0-Windows-x64
          path: artifacts/
          if-no-files-found: error
      - name: Attach verified Windows installer to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.14.0 >/dev/null 2>&1 || gh release create v0.14.0 --draft --target "$GITHUB_SHA" --title 'Solar 0.14.0' --notes 'First Windows x64 release and macOS window spacing update. Release preparation.'
          if [ "$(gh release view v0.14.0 --json isDraft --jq .isDraft)" = "true" ]; then
            gh release upload v0.14.0 artifacts/Solar-0.14.0-Windows-x64-setup.exe artifacts/SHA256SUMS-Windows.txt artifacts/windows-verification.json --clobber
          fi
