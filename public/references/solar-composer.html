<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Solar Composer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap">
<style>
/* Concept: la barre de saisie de Solar sur un ciel de nuages animé (WebGL). À l'envoi, chute à travers les nuages
   avec flou de mouvement, puis fondu vers le fond blanc ou noir de l'app. Un seul accent bleu-vert pour les outils. */
:root {
  --bg: #ffffff;
  --fb-a: #87ceeb;
  --fb-b: #f4f8fb;
  --ink: #1b1d20;
  --ink-2: #5b5f67;
  --ink-3: #686c74;
  --ink-soft: rgba(27, 29, 32, 0.5);
  --glass: rgba(255, 255, 255, 0.62);
  --glass-border: rgba(24, 30, 38, 0.09);
  --glass-border-strong: rgba(24, 30, 38, 0.2);
  --glass-hi: rgba(255, 255, 255, 0.85);
  --pop-bg: rgba(255, 255, 255, 0.82);
  --shadow: 0 10px 28px -16px rgba(34, 52, 78, 0.3), 0 1px 3px rgba(34, 52, 78, 0.06);
  --banner: rgba(24, 30, 38, 0.05);
  --chip-bg: rgba(24, 30, 38, 0.06);
  --chip-hover: rgba(24, 30, 38, 0.11);
  --tool-bg: #d8ebef;
  --tool-ink: #0e5d6e;
  --send-bg: #1b1d20;
  --send-ink: #ffffff;
  --send-off-bg: rgba(24, 30, 38, 0.08);
  --send-off-ink: #7b7f87;
  --caret: #1d86a1;
  --focus: #1b7fa0;
  --font-display: "Helvetica Neue", "Neue Haas Grotesk Display", Helvetica, "Inter Tight", Arial, sans-serif;
  --font-ui: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter Tight", system-ui, sans-serif;
  --spring: cubic-bezier(0.22, 1, 0.36, 1);
  --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
}
@supports (transition-timing-function: linear(0, 1)) {
  :root {
    --spring: linear(0, 0.0303, 0.0946, 0.1866, 0.2892, 0.3932, 0.4853, 0.5773, 0.6592, 0.7303, 0.7864, 0.8373, 0.8789, 0.91, 0.9368, 0.9575, 0.9732, 0.984, 0.9925, 0.9984, 1.0024, 1.0047, 1.006, 1.0066, 1.0067, 1.0064, 1.0058, 1.0052, 1.0045, 1.0038, 1.0032, 1.0026, 1.0021, 1.0017, 1.0013, 1.001, 1.0007, 1.0005, 1.0004, 1.0002, 1);
    --pop: linear(0, 0.0423, 0.1437, 0.268, 0.4169, 0.5656, 0.7029, 0.822, 0.9127, 0.9891, 1.0439, 1.0792, 1.0983, 1.1043, 1.1014, 1.0918, 1.0782, 1.0628, 1.0484, 1.0337, 1.0209, 1.0102, 1.002, 0.9964, 0.9923, 0.99, 0.9891, 0.9893, 0.9902, 0.9915, 0.9931, 0.9948, 0.9963, 0.9976, 0.9987, 0.9996, 1.0003, 1.0008, 1.001, 1.0011, 1);
  }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b;
    --fb-a: #04060c;
    --fb-b: #1b2434;
    --ink: #f3f4f6;
    --ink-2: #a9afba;
    --ink-3: #9aa2ae;
    --ink-soft: rgba(243, 244, 246, 0.5);
    --glass: rgba(40, 46, 57, 0.56);
    --glass-border: rgba(255, 255, 255, 0.11);
    --glass-border-strong: rgba(255, 255, 255, 0.24);
    --glass-hi: rgba(255, 255, 255, 0.09);
    --pop-bg: rgba(38, 44, 55, 0.84);
    --shadow: 0 10px 28px -16px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.25);
    --banner: rgba(255, 255, 255, 0.07);
    --chip-bg: rgba(255, 255, 255, 0.08);
    --chip-hover: rgba(255, 255, 255, 0.15);
    --tool-bg: rgba(111, 203, 220, 0.16);
    --tool-ink: #95dae7;
    --send-bg: #f3f4f6;
    --send-ink: #12161c;
    --send-off-bg: rgba(255, 255, 255, 0.1);
    --send-off-ink: #8c939e;
    --caret: #7fd0e0;
    --focus: #7fd0e0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b;
  --fb-a: #04060c;
  --fb-b: #1b2434;
  --ink: #f3f4f6;
  --ink-2: #a9afba;
  --ink-3: #9aa2ae;
  --ink-soft: rgba(243, 244, 246, 0.5);
  --glass: rgba(40, 46, 57, 0.56);
  --glass-border: rgba(255, 255, 255, 0.11);
  --glass-border-strong: rgba(255, 255, 255, 0.24);
  --glass-hi: rgba(255, 255, 255, 0.09);
  --pop-bg: rgba(38, 44, 55, 0.84);
  --shadow: 0 10px 28px -16px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.25);
  --banner: rgba(255, 255, 255, 0.07);
  --chip-bg: rgba(255, 255, 255, 0.08);
  --chip-hover: rgba(255, 255, 255, 0.15);
  --tool-bg: rgba(111, 203, 220, 0.16);
  --tool-ink: #95dae7;
  --send-bg: #f3f4f6;
  --send-ink: #12161c;
  --send-off-bg: rgba(255, 255, 255, 0.1);
  --send-off-ink: #8c939e;
  --caret: #7fd0e0;
  --focus: #7fd0e0;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.5s ease, color 0.3s ease;
}
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Fond : ciel de nuages en WebGL. Le canvas se cache une fois le fond uni atteint, le fond de l'app prend le relais. */
.scene { position: relative; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.scene.nogl { background: linear-gradient(180deg, var(--fb-a), var(--fb-b)); }
.sky-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; transition: opacity 0.7s ease; }
.sky-canvas[hidden] { display: none !important; }
.veil { position: absolute; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; }

/* Barre du haut de l'aperçu */
.chrome {
  position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; padding: 16px clamp(16px, 3vw, 28px);
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.brand span { font-size: 13px; color: var(--ink-2); }
.tools-top { display: flex; align-items: center; gap: 10px; }
.seg {
  position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.seg-ind {
  position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px;
  background: var(--send-bg); transition: transform 0.5s var(--spring);
}
.seg[data-value="dark"] .seg-ind { transform: translateX(100%); }
.seg button {
  position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent;
  font-size: 13px; font-weight: 500; color: var(--ink-2); transition: color 0.25s ease;
}
.seg button[aria-pressed="true"] { color: var(--send-ink); }
.ghost {
  display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-border); font-size: 13px; font-weight: 500; color: var(--ink);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); transition: background-color 0.2s ease;
}
.ghost:hover { background: var(--chip-hover); }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }

/* Scène : la barre est centrée au départ. Après l'envoi elle glisse en bas et les messages s'affichent au-dessus. */
.stage {
  position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 0 16px 24px;
}
.messages { display: none; }
.stage.chatting { justify-content: flex-end; padding-bottom: 28px; }
.stage.chatting .messages {
  display: flex; flex-direction: column; gap: 22px; flex: 1; min-height: 0; width: min(640px, 100%);
  overflow-y: auto; padding: 8px 2px 22px; box-sizing: border-box;
}
.msg-user {
  align-self: flex-end; max-width: 82%; padding: 10px 16px; border-radius: 20px; background: var(--chip-bg);
  font-size: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; animation: rise 0.7s var(--spring) backwards;
}
.msg-ai { align-self: flex-start; max-width: 100%; font-size: 16px; line-height: 1.7; color: var(--ink); animation: rise 0.7s var(--spring) backwards; }
.msg-ai .w { display: inline; animation: wordIn 0.45s ease backwards; }
@keyframes wordIn { from { opacity: 0; filter: blur(4px); } }

/* Le conteneur garde une hauteur fixe : la barre est ancrée en bas et grandit vers le haut, rien ne saute. */
.slot { position: relative; width: min(640px, 100%); height: 114px; flex: none; }
.stack { position: absolute; left: 0; right: 0; bottom: 0; }
.stage.chatting .slot { height: auto; }
.stage.chatting .stack { position: relative; }

/* Barre de saisie en verre léger */
.bar {
  position: relative; border-radius: 28px; background: var(--glass); border: 1px solid var(--glass-border);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5);
  transition: border-color 0.25s ease, background-color 0.5s ease;
}
.bar::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 1px 0 var(--glass-hi);
}
.bar:focus-within { border-color: var(--glass-border-strong); }

/* Bandeau d'état */
.banner-wrap {
  display: grid; grid-template-rows: 0fr; opacity: 0; visibility: hidden;
  transition: grid-template-rows 0.5s var(--spring), opacity 0.25s ease, visibility 0s linear 0.5s;
}
.banner-wrap[data-open="true"] {
  grid-template-rows: 1fr; opacity: 1; visibility: visible;
  transition: grid-template-rows 0.5s var(--spring), opacity 0.3s ease, visibility 0s;
}
.banner-clip { min-height: 0; overflow: hidden; border-radius: 22px 22px 0 0; }
.banner {
  display: flex; align-items: center; gap: 14px; margin: 6px 6px 0; padding: 12px 12px 12px 16px;
  border-radius: 22px; background: var(--banner);
}
.glyph { position: relative; width: 26px; height: 26px; flex: none; color: var(--ink); }
.glyph > * {
  position: absolute; inset: 0; margin: auto; opacity: 0; transform: scale(0.7);
  transition: opacity 0.2s ease, transform 0.45s var(--pop);
}
.dots { display: flex; align-items: center; justify-content: center; gap: 4px; width: 26px; height: 26px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: dot 1.2s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
.glyph svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.glyph .g-done { color: var(--tool-ink); }
.glyph .g-stop { color: var(--ink-2); }
.glyph[data-state="thinking"] .dots, .glyph[data-state="writing"] .dots,
.glyph[data-state="done"] .g-done, .glyph[data-state="stopped"] .g-stop { opacity: 1; transform: none; }
.texts { min-width: 0; flex: 1; }
.b-title { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
.b-title span { display: inline-block; }
.b-title .swap { animation: swapIn 0.4s var(--spring) backwards; }
.b-sub { margin: 1px 0 0; font-size: 13px; line-height: 1.3; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.shimmer {
  background: linear-gradient(100deg, var(--ink) 35%, var(--ink-3) 50%, var(--ink) 65%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 2.4s linear infinite;
}
.stop {
  height: 34px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--chip-bg); color: var(--ink);
  font-size: 14px; font-weight: 500; transition: background-color 0.2s ease, opacity 0.25s ease, transform 0.3s var(--spring);
}
.stop:hover { background: var(--chip-hover); }
.stop:active { transform: scale(0.95); }
.stop[data-show="false"] { opacity: 0; pointer-events: none; }

/* Pièces jointes */
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px 0; }
.chips:empty { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 7px; border-radius: 999px;
  background: var(--chip-bg); border: 1px solid var(--glass-border); font-size: 13px;
  animation: chipIn 0.5s var(--pop) backwards; transition: opacity 0.2s ease, transform 0.25s ease;
}
.chip.leaving { opacity: 0; transform: scale(0.88); }
.thumb { width: 24px; height: 24px; border-radius: 8px; object-fit: cover; flex: none; }
.thumb.file { display: inline-flex; align-items: center; justify-content: center; background: var(--chip-hover); color: var(--ink-2); }
.thumb.file svg { width: 14px; height: 14px; }
.chip-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-x {
  display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; border: 0;
  border-radius: 50%; background: transparent; color: var(--ink-2); transition: background-color 0.2s ease;
}
.chip-x:hover { background: var(--chip-hover); color: var(--ink); }
.chip-x svg { width: 13px; height: 13px; }

/* Champ */
.field {
  display: block; width: 100%; box-sizing: border-box; max-height: 200px; min-height: 52px; padding: 16px 22px 6px;
  border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); caret-color: var(--caret);
  font-size: 17px; line-height: 1.5; overflow-y: auto; transition: height 0.2s ease;
}
.field::placeholder { color: var(--ink-3); opacity: 1; }

/* Rangée d'actions */
.toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px 12px; }
.spacer { flex: 1; }
.round {
  display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; padding: 0; border: 0;
  border-radius: 50%; background: var(--chip-bg); color: var(--ink-2);
  transition: background-color 0.2s ease, color 0.2s ease, transform 0.3s var(--spring);
}
.round:hover { background: var(--chip-hover); color: var(--ink); }
.round:active { transform: scale(0.93); }
.round svg { transition: transform 0.45s var(--spring); }
.round.plus:hover svg { transform: rotate(90deg); }
.tools-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 15px; border: 0; border-radius: 999px;
  background: var(--tool-bg); color: var(--tool-ink); font-size: 13.5px; font-weight: 600;
  transition: transform 0.3s var(--spring), filter 0.2s ease;
}
.tools-btn:hover { filter: brightness(1.06); }
.tools-btn:active { transform: scale(0.96); }
.tools-btn .bump { animation: swapIn 0.4s var(--spring) backwards; }
.send {
  display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; padding: 0; border: 0;
  border-radius: 50%; background: var(--send-off-bg); color: var(--send-off-ink);
  transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s var(--spring);
}
.send:disabled { cursor: default; }
.send[data-ready="true"] { background: var(--send-bg); color: var(--send-ink); animation: sendPop 0.5s var(--pop); }
.send[data-ready="true"]:active { transform: scale(0.92); }
.send svg { width: 20px; height: 20px; stroke-width: 2.2; transition: transform 0.4s var(--spring); }
.send[data-ready="true"]:hover svg { transform: translateY(-2px); }

/* Menu des outils */
.pop {
  position: absolute; left: 12px; bottom: calc(100% + 10px); z-index: 5; width: min(300px, calc(100% - 24px));
  box-sizing: border-box; padding: 8px; border-radius: 22px; background: var(--pop-bg); border: 1px solid var(--glass-border);
  box-shadow: var(--shadow); -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5);
  transform-origin: 24px 100%; opacity: 0; visibility: hidden; transform: translateY(8px) scale(0.95);
  transition: opacity 0.18s ease, transform 0.4s var(--spring), visibility 0s linear 0.2s;
}
.pop[data-open="true"] { opacity: 1; visibility: visible; transform: none; transition: opacity 0.2s ease, transform 0.5s var(--spring), visibility 0s; }
.pop-title { margin: 0; padding: 8px 12px 6px; font-size: 13px; color: var(--ink-2); }
.pitem {
  display: flex; align-items: center; gap: 12px; width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 14px;
  background: transparent; text-align: left; font-size: 14.5px; color: var(--ink);
  opacity: 0; transform: translateY(5px);
  transition: background-color 0.2s ease, opacity 0.25s ease, transform 0.45s var(--spring);
}
.pop[data-open="true"] .pitem { opacity: 1; transform: none; transition-delay: 0s, calc(var(--i) * 28ms + 40ms), calc(var(--i) * 28ms + 40ms); }
.pitem:hover { background: var(--chip-bg); }
.pitem svg.i { color: var(--ink-2); transition: color 0.2s ease; }
.pitem[aria-checked="true"] svg.i { color: var(--ink); }
.pitem .lbl { flex: 1; }
.tick {
  position: relative; width: 22px; height: 22px; flex: none; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--ink-3);
  transition: background-color 0.25s ease, border-color 0.25s ease;
}
.tick svg { position: absolute; inset: 0; margin: auto; width: 13px; height: 13px; fill: none; stroke: var(--tool-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(0.4); transition: opacity 0.2s ease, transform 0.4s var(--pop); }
.pitem[aria-checked="true"] .tick { background: var(--tool-bg); border-color: transparent; }
.pitem[aria-checked="true"] .tick svg { opacity: 1; transform: none; }


/* Entrée */
.intro .bar { animation: rise 0.9s var(--spring) 0.14s backwards; }

@keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(8px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes dot { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.15); } }
@keyframes shimmer { from { background-position: 130% 0; } to { background-position: -130% 0; } }
@keyframes swapIn { from { opacity: 0; transform: translateY(6px); } }
@keyframes chipIn { from { opacity: 0; transform: scale(0.85); } }
@keyframes sendPop { from { transform: scale(0.84); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  .shimmer { animation: none; background: none; color: var(--ink); }
  .dots i { animation: none; opacity: 1; }
}
@media (max-width: 480px) {
  .brand span { display: none; }
  .toolbar { padding: 4px 10px 10px; }
  .tools-btn { padding: 0 12px; }
}
</style>

<div class="scene intro" id="scene">
  <canvas class="sky-canvas" id="sky" aria-hidden="true"></canvas>
  <div class="veil" id="veil" aria-hidden="true"></div>

  <header class="chrome">
    <div class="brand"><b>Solar</b><span>Barre de saisie, aperçu</span></div>
    <div class="tools-top">
      <div class="seg" id="seg" data-value="light" role="group" aria-label="Thème de l'aperçu">
        <span class="seg-ind" aria-hidden="true"></span>
        <button type="button" id="th-light" aria-pressed="true"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-2.93 1.41-1.41m11.32-11.32 1.41-1.41M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41"/></svg>Clair</button>
        <button type="button" id="th-dark" aria-pressed="false"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>Sombre</button>
      </div>
      <button type="button" class="ghost" id="replay"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Rejouer</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="slot" id="slot"><div class="stack">
