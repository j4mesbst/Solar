[package]
name = "solar"
version = "0.15.1"
description = "Solar desktop application"
edition = "2021"

[lib]
name = "solar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["macros", "time", "sync"] }
libc = "0.2"

whisper-rs = { version = "=0.16.0" }
hound = "3.5"
sha2 = "0.10"

rusqlite = { version = "=0.32.1", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "=0.16.0"
