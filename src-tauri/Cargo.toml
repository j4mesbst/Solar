[package]
name = "solar"
version = "0.1.0"
description = "Solar desktop application"
edition = "2021"

[lib]
name = "solar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
keyring = "3"
